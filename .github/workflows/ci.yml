name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# No permissions needed beyond defaults; individual jobs declare what they require.
permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install project and dev dependencies
        run: uv sync --dev

      - name: Run test suite
        run: uv run pytest
